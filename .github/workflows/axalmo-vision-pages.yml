name: Axalmo Vision – publicera till GitHub Pages

on:
  push:
    branches: [main]
    paths: ['axalmo-vision/**', '.github/workflows/axalmo-vision-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per gren: en (överhoppad) körning från en annan gren får inte avbryta en pågående publicering från main.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Publicering får bara ske från main – även vid manuell start (workflow_dispatch kan väljas mot valfri gren).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axalmo-vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: axalmo-vision/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: axalmo-vision/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
